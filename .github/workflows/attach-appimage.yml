name: Attach AppImage to release

on:
  workflow_run:
    workflows: ["Build a selected Vortex version"]
    types: [completed]

jobs:
  attach:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/github-script@v7
        with:
          script: |
            const runId = ${{ github.event.workflow_run.id }};
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            const appimage = artifacts.find(a => a.name.includes('appimage'));
            if (!appimage) throw new Error('No AppImage artifact');
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: appimage.id,
              archive_format: 'zip'
            });
            // artifact download handling omitted for brevity
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
