name: Sync upstream and release patched AppImage

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: write
      actions: write
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm git

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream
        run: |
          git config --global --add safe.directory /__w/VortexLinux/VortexLinux
          git remote add upstream https://github.com/Arkazzae/VortexLinux.git || true
          git fetch upstream

      - name: Merge upstream
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git merge --no-edit upstream/master || true
          git checkout -- patches/0042-witcher3-use-vortex-fs-rename.patch || true

      - name: Ensure patch in PKGBUILD
        run: |
          grep -q "0042-witcher3-use-vortex-fs-rename.patch" PKGBUILD || sed -i "/'0041-linux-plugin-folder-prefix.patch'/a \\  '0042-witcher3-use-vortex-fs-rename.patch'" PKGBUILD
          sed -i "s/'nodejs-lts-krypton'/'nodejs'/" PKGBUILD
          sed -i "s/patch -Np1 -i \"\$srcdir\/\$compatibility_patch\"/patch -Np1 --forward -i \"\$srcdir\/\$compatibility_patch\" || true/" PKGBUILD

      - name: Regenerate .SRCINFO
        run: |
          useradd -m builder
          chown -R builder:builder /__w/VortexLinux/VortexLinux
          sudo -u builder bash -c "makepkg --printsrcinfo" > .SRCINFO

      - name: Commit and tag
        id: version
        run: |
          git add PKGBUILD .SRCINFO patches/0042-witcher3-use-vortex-fs-rename.patch
          git diff --cached --quiet || git commit -m "chore(sync): upstream merge and Witcher3 fix"
          PKGVER=$(grep '^pkgver=' PKGBUILD | head -n1 | cut -d= -f2 | tr -d "'")
          TAG="v${PKGVER}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "pkgver=$PKGVER" >> $GITHUB_OUTPUT
          git tag -f "$TAG"
          if [ -n "${{ secrets.PAT_TOKEN }}" ]; then
            git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          fi
          git push origin master --force-with-lease
          git push origin :refs/tags/$TAG || true
          git push origin "$TAG"

      - name: Trigger build workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-on-tag.yml/dispatches \
            -d "{\"ref\":\"master\",\"inputs\":{\"tag\":\"${{ steps.version.outputs.tag }}\"}}"
