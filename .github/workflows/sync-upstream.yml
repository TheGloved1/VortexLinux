name: Sync upstream Arkazzae/VortexLinux and release patched AppImage

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Arkazzae/VortexLinux.git || true
          git fetch upstream

      - name: Merge upstream
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git merge --no-edit upstream/master || true
          git checkout -- patches/0042-witcher3-use-vortex-fs-rename.patch || true

      - name: Ensure Witcher3 patch in PKGBUILD
        run: |
          if ! grep -q "0042-witcher3-use-vortex-fs-rename.patch" PKGBUILD; then
            sed -i "/'0041-linux-plugin-folder-prefix.patch'/a \\  '0042-witcher3-use-vortex-fs-rename.patch'" PKGBUILD
          fi
          sed -i "s/'nodejs-lts-krypton'/'nodejs'/" PKGBUILD
          sed -i "s/patch -Np1 -i \"\$srcdir\/\$compatibility_patch\"/patch -Np1 --forward -i \"\$srcdir\/\$compatibility_patch\" || true/" PKGBUILD

      - name: Commit changes
        run: |
          git add PKGBUILD patches/0042-witcher3-use-vortex-fs-rename.patch
          git diff --cached --quiet || git commit -m "chore(sync): upstream merge and ensure Witcher3 fix"

      - name: Get pkgver and push
        id: version
        run: |
          PKGVER=$(grep '^pkgver=' PKGBUILD | head -n1 | cut -d= -f2 | tr -d "'")
          TAG="v${PKGVER}-witcher3-fix"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          git tag -f "$TAG"
          git push origin master --force-with-lease
          git push origin "$TAG" --force

      - name: Regenerate .SRCINFO in Arch container
        runs-on: ubuntu-latest
        container:
          image: archlinux:base-devel
        steps:
          - name: Checkout again
            uses: actions/checkout@v4
            with:
              ref: ${{ steps.version.outputs.tag }}
              fetch-depth: 0
          - name: Install git
            run: pacman -Syu --noconfirm git
          - name: Generate SRCINFO
            run: makepkg --printsrcinfo > .SRCINFO
          - name: Commit SRCINFO
            run: |
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"
              git add .SRCINFO
              git diff --cached --quiet || git commit -m "chore: regenerate .SRCINFO"
              git push origin master

      - name: Dispatch AppImage build
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            const pkgver = tag.replace(/^v/, '').replace(/-witcher3-fix$/, '');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-version.yml',
              ref: tag,
              inputs: {
                version: pkgver,
                format: 'appimage',
                packaging_ref: tag
              }
            });

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Witcher3 fix ${{ steps.version.outputs.tag }}
          body: Auto-synced from Arkazzae/VortexLinux with Witcher3 mods.settings rename fix.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
